<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Medical Reports</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f7fb;
        }

        .navbar{
            background:#0d6efd;
            color:white;
            padding:18px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-weight:bold;
        }

        .container{
            width:90%;
            margin:auto;
            margin-top:40px;
        }

        h1{
            margin-bottom:30px;
        }

        .report-card{

            background:white;
            padding:25px;
            margin-bottom:25px;
            border-radius:12px;
            box-shadow:0px 5px 15px rgba(0,0,0,.1);

        }

        .report-card h2{

            color:#0d6efd;
            margin-bottom:10px;

        }

        .date{

            color:gray;
            margin-bottom:20px;

        }

        .btn{

            text-decoration:none;
            color:white;
            padding:10px 18px;
            border-radius:6px;
            margin-right:10px;
            display:inline-block;

        }

        .view{

            background:#0d6efd;

        }

        .chat{

            background:#198754;

        }

        .delete{

            background:#dc3545;

        }

        .empty{

            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;

        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>🩺 MedAssist AI</h2>

    <div>

        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'upload' %}">Upload</a>

        <a href="{% url 'logout' %}">Logout</a>

    </div>

</div>


<div class="container">

<h1>📂 My Medical Reports</h1>

{% for report in reports %}

<div class="report-card">

    <h2>{{ report.title }}</h2>

    <p class="date">

        📅 Uploaded:
        {{ report.uploaded_at }}

    </p>

    <a
    href="{{ report.pdf.url }}"
    target="_blank"
    class="btn view">

        👁 View PDF

    </a>


    <a
    href="{% url 'chat' report.id %}"
    class="btn chat">

        🤖 Ask AI

    </a>


    <a
    href="{% url 'delete_report' report.id %}"
    class="btn delete"
    onclick="return confirm('Delete this report?')">

        🗑 Delete

    </a>

</div>

{% empty %}

<div class="empty">

<h2>No Reports Uploaded Yet.</h2>

<br>

<a
href="{% url 'upload' %}"
class="btn view">

Upload Your First Report

</a>

</div>

{% endfor %}

</div>

</body>

</html>
