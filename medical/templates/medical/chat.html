<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical AI Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#eef2f7;

}

.navbar{

background:#0d6efd;
color:white;

padding:18px 40px;

display:flex;

justify-content:space-between;

align-items:center;

}

.navbar a{

color:white;

text-decoration:none;

margin-left:20px;

font-weight:600;

}

.container{

width:90%;

max-width:1000px;

margin:40px auto;

}

.chat-card{

background:white;

border-radius:15px;

padding:30px;

box-shadow:0px 10px 25px rgba(0,0,0,.12);

}

.chat-title{

color:#0d6efd;

margin-bottom:8px;

}

.report-name{

color:#666;

margin-bottom:25px;

}

textarea{

width:100%;

height:110px;

padding:15px;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

resize:none;

outline:none;

}

textarea:focus{

border:1px solid #0d6efd;

}

button{

margin-top:15px;

padding:12px 25px;

background:#0d6efd;

color:white;

border:none;

border-radius:8px;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#0056d2;

}

.chat-box{

margin-top:35px;

}

.user{

background:#d1ecf1;

padding:15px;

border-radius:12px;

margin-bottom:12px;

}

.ai{

background:#d4edda;

padding:15px;

border-radius:12px;

margin-bottom:20px;

}

.user strong{

color:#0c5460;

}

.ai strong{

color:#155724;

}

.empty{

text-align:center;

padding:30px;

color:gray;

}

</style>

</head>

<body>

<div class="navbar">

<h2>🩺 MedAssist AI</h2>

<div>

<a href="{% url 'home' %}">Home</a>

<a href="{% url 'upload' %}">Upload</a>

<a href="{% url 'reports' %}">Reports</a>

<a href="{% url 'logout' %}">Logout</a>

</div>

</div>


<div class="container">

<div class="chat-card">

<h1 class="chat-title">

🤖 Medical AI Assistant

</h1>

<p class="report-name">

📄 {{ report.title }}

</p>

<form method="POST">

{% csrf_token %}

<textarea

name="question"

placeholder="Ask anything about your medical report..."

required></textarea>

<button type="submit">

🚀 Ask AI

</button>

</form>

<div class="chat-box">

<h2>

💬 Chat History

</h2>

<br>

{% for chat in history %}

<div class="user">

<strong>🙋 You</strong>

<br><br>

{{ chat.question }}

</div>

<div class="ai">

<strong>🤖 AI</strong>

<br><br>

{{ chat.answer }}

</div>

{% empty %}

<div class="empty">

No conversation yet.

</div>

{% endfor %}

</div>

</div>

</div>

</body>

</html>
