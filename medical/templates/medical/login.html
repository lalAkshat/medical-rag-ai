{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MedAssist AI</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Left Side -->
    <div class="left-side">

        <h1>🩺 MedAssist AI</h1>

        <h2>Welcome Back</h2>

        <p>
            Login to continue using your intelligent Medical RAG Assistant.
        </p>

    </div>

    <!-- Right Side -->
    <div class="right-side">

        <div class="login-card">

            <h2>Login</h2>

            <form method="POST">

                {% csrf_token %}

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter Email"
                        required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter Password"
                        required>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="submit" class="login-btn">

                    Login

                </button>

                <p class="register-text">

                    Don't have an account?

                    <a href="/register/">Register</a>

                </p>

            </form>

        </div>

    </div>

</div>

<script src="{% static 'js/login.js' %}"></script>

</body>
</html>
